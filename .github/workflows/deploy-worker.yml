name: Deploy Worker
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      run_encryption_migration:
        description: Encrypt or rotate all historical message and attachment data
        required: false
        default: false
        type: boolean
      backup_confirmation:
        description: Type BACKUP_COMPLETED after backing up D1 and R2
        required: false
        default: ''
        type: string
concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Ensure Cloudflare resources
        id: ensure_resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/ensure-cloudflare-resources.mjs
      - name: Generate wrangler config for CI
        shell: bash
        run: |
          cp wrangler.example.toml wrangler.ci.toml
          sed -i "s|YOUR_D1_DATABASE_ID_HERE|${{ steps.ensure_resources.outputs.d1_database_id }}|g" wrangler.ci.toml
          sed -i "s|YOUR_KV_NAMESPACE_ID_HERE|${{ steps.ensure_resources.outputs.kv_namespace_id }}|g" wrangler.ci.toml
      - name: Initialize D1 schema (first creation only)
        if: steps.ensure_resources.outputs.d1_created == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --file worker/schema.sql --config wrangler.ci.toml
      - name: Ensure encryption migration schema
        run: npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --file worker/migrations/2026-08-10-server-encryption.sql --config wrangler.ci.toml
      - name: Generate admin bootstrap SQL (optional)
        env:
          EDGECHAT_ADMIN_USERNAME: ${{ secrets.EDGECHAT_ADMIN_USERNAME || secrets.CFCHAT_ADMIN_USERNAME }}
          EDGECHAT_ADMIN_PASSWORD: ${{ secrets.EDGECHAT_ADMIN_PASSWORD || secrets.CFCHAT_ADMIN_PASSWORD }}
          EDGECHAT_ADMIN_DISPLAY_NAME: ${{ secrets.EDGECHAT_ADMIN_DISPLAY_NAME || secrets.CFCHAT_ADMIN_DISPLAY_NAME }}
        shell: bash
        run: |
          if [[ -n "$EDGECHAT_ADMIN_USERNAME" && -n "$EDGECHAT_ADMIN_PASSWORD" ]]; then
            node .github/scripts/generate-admin-bootstrap-sql.mjs
          else
            echo "Skipping admin bootstrap SQL generation; admin credentials were not provided."
          fi
      - name: Ensure admin user (optional)
        if: hashFiles('.tmp/edgechat-admin-upsert.sql') != ''
        run: npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --file .tmp/edgechat-admin-upsert.sql --config wrangler.ci.toml
      - name: Prepare Worker secrets
        env:
          EDGECHAT_ENCRYPTION_KEYRING: ${{ secrets.EDGECHAT_ENCRYPTION_KEYRING }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .tmp
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; import { loadEncryptionKeyring } from "./worker/src/encryption.js"; const value = process.env.EDGECHAT_ENCRYPTION_KEYRING; if (!value) throw new Error("Missing GitHub secret: EDGECHAT_ENCRYPTION_KEYRING"); loadEncryptionKeyring(value); writeFileSync(".tmp/worker-secrets.json", JSON.stringify({ EDGECHAT_ENCRYPTION_KEYRING: value }), { mode: 0o600 });'
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.ci.toml --secrets-file .tmp/worker-secrets.json
      - name: Migrate or rotate historical encryption
        if: github.event_name == 'workflow_dispatch' && inputs.run_encryption_migration == true
        env:
          EDGECHAT_ENCRYPTION_KEYRING: ${{ secrets.EDGECHAT_ENCRYPTION_KEYRING }}
          EDGECHAT_ENCRYPTION_MIGRATION_CONFIRM: ${{ inputs.backup_confirmation }}
          EDGECHAT_D1_DATABASE_NAME: ${{ steps.ensure_resources.outputs.d1_database_name }}
          EDGECHAT_R2_BUCKET_NAME: ${{ steps.ensure_resources.outputs.r2_bucket_name }}
          EDGECHAT_WRANGLER_CONFIG: wrangler.ci.toml
        run: npm run migrate:encryption
      - name: Remove temporary secret files
        if: always()
        shell: bash
        run: rm -f .tmp/worker-secrets.json